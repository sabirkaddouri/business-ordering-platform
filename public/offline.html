<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne / Offline / غير متصل</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #2C1810;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: #FFFFFF;
      border: 1px solid #E0D5C5;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(44, 24, 16, 0.08);
    }
    .icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 20px;
      display: inline-block;
    }
    .lang-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #E0D5C5;
    }
    .lang-section:last-of-type {
      border-bottom: none;
      margin-bottom: 28px;
      padding-bottom: 0;
    }
    .lang-section.rtl {
      direction: rtl;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #C4622D;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #6B4C3B;
      line-height: 1.5;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #C4622D;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-retry:hover {
      background-color: #A8501F;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="icon">📡</div>

    <!-- French -->
    <div class="lang-section">
      <h1>Vous êtes hors ligne</h1>
      <p>Vérifiez votre connexion Internet et réessayez.</p>
    </div>

    <!-- English -->
    <div class="lang-section">
      <h1>You're offline</h1>
      <p>Please check your internet connection and try again.</p>
    </div>

    <!-- Arabic -->
    <div class="lang-section rtl">
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يرجى التحقق من اتصالك بالإنترنت وإعادة المحاولة.</p>
    </div>

    <button class="btn-retry" onclick="window.location.reload()">
      🔄 Réessayer / Retry / إعادة المحاولة
    </button>
  </main>
</body>
</html>
